name: SonarCloud Code Quality Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sonarcloud:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Linter (ESLint & TypeScript) and Generate ESLint Report
        run: |
          npm run lint
          npx eslint . -f json -o eslint-report.json

      - name: Run Unit Tests with Coverage (LCOV)
        run: npm run test:unit

      - name: SonarCloud Scan & Quality Gate
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=dimasfrandika
            -Dsonar.projectKey=Dimasfrandika_Aplikasi-Web-CRUD-gudang-dengan-bahasa-pemrograman-KOTLIN-Framework-UI-Java-FX
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.eslint.reportPaths=eslint-report.json
