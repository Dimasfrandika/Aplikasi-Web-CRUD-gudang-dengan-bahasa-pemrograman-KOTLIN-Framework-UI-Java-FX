<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/gambar.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manajemen Data Gudang</title>
    <meta name="description" content="Aplikasi Web CRUD Gudang dengan manajemen data stok barang, autentikasi user, dan antarmuka responsif." />
    <meta property="og:title" content="Manajemen Data Gudang" />
    <meta property="og:description" content="Aplikasi Web CRUD Gudang dengan manajemen data stok barang, autentikasi user, dan antarmuka responsif." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Suppress Vite HMR WebSocket noise in cloud proxy preview
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e.reason &&
          (typeof e.reason.message === 'string' &&
            (e.reason.message.includes('WebSocket closed without opened') ||
             e.reason.message.includes('failed to connect to websocket')))
        ) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
      window.addEventListener('error', function (e) {
        if (
          e.message &&
          (e.message.includes('WebSocket closed without opened') ||
           e.message.includes('[vite] failed to connect to websocket'))
        ) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
