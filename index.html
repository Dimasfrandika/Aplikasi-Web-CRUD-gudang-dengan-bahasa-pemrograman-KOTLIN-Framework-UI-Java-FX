<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/gambar.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manajemen Data Gudang</title>
    <meta name="description" content="Aplikasi Web CRUD Gudang dengan manajemen data stok barang, autentikasi user, dan antarmuka responsif." />
    <meta property="og:title" content="Manajemen Data Gudang" />
    <meta property="og:description" content="Aplikasi Web CRUD Gudang dengan manajemen data stok barang, autentikasi user, dan antarmuka responsif." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Clean listener to silence harmless Vite HMR connection drops without tampering with native WebSocket
      window.addEventListener('unhandledrejection', function (e) {
        var msg = (e && e.reason && (e.reason.message || String(e.reason))) || '';
        if (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('[vite]') !== -1) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = (e && (e.message || '')) || '';
        if (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('[vite]') !== -1) {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
