# ====================================================================
# SONARQUBE CONFIGURATION FILE
# Sistem Manajemen Pergudangan & Logistik
# ====================================================================

# Identitas Proyek di SonarQube Server
sonar.projectKey=gudang-management-system
sonar.projectName=Sistem Manajemen Pergudangan & Logistik
sonar.projectVersion=1.0.0

# Direktori Sumber Kode & Pengujian
sonar.sources=src,utils,server.ts
sonar.tests=utils,tests,tests-bdd
sonar.test.inclusions=**/*.test.js,**/*.test.ts,tests-bdd/**/*.js

# Laporan Code Coverage (Jest LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.test.ts,tests-bdd/**,dist/**,node_modules/**,scripts/**

# Standar Kualitas SonarQube (Quality Gate Criteria)
# - Reliability: Rating A (0 Bugs)
# - Maintainability: Rating A (0 Code Smells, Debt Ratio < 5%)
# - Security: Rating A (0 Vulnerabilities, 0 Hotspots)
# - Coverage: >= 80%
sonar.qualitygate.wait=false

# Encoding
sonar.sourceEncoding=UTF-8

# Host URL SonarQube Server (dapat diubah via Environment Variable SONAR_HOST_URL)
sonar.host.url=http://localhost:9000
