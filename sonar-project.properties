# ====================================================================
# SONARCLOUD / SONARQUBE CONFIGURATION FILE
# Sistem Manajemen Pergudangan & Logistik
# ====================================================================

# Identitas Organisasi & Proyek di SonarCloud (https://sonarcloud.io)
# Ganti nilai di bawah sesuai Organization Key & Project Key dari dashboard SonarCloud Anda
sonar.organization=ISI_ORGANIZATION_KEY_ANDA
sonar.projectKey=ISI_PROJECT_KEY_DARI_SONARCLOUD
sonar.projectName=Sistem Manajemen Pergudangan & Logistik
sonar.projectVersion=1.0.0

# Direktori Sumber Kode & Pengujian
sonar.sources=src,utils,server.ts
sonar.tests=utils,tests,tests-bdd
sonar.test.inclusions=**/*.test.js,**/*.test.ts,tests-bdd/**/*.js

# Laporan Code Coverage (Jest LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.test.ts,tests-bdd/**,dist/**,node_modules/**,scripts/**

# Laporan External Linter (ESLint JSON Report)
sonar.eslint.reportPaths=eslint-report.json

# Standar Kualitas SonarCloud (Quality Gate Criteria)
# - Reliability: Rating A (0 Bugs)
# - Maintainability: Rating A (0 Code Smells, Debt Ratio < 5%)
# - Security: Rating A (0 Vulnerabilities, 0 Hotspots)
# - Coverage: >= 80%
sonar.qualitygate.wait=true

# Encoding
sonar.sourceEncoding=UTF-8

# Host URL SonarCloud
sonar.host.url=https://sonarcloud.io
